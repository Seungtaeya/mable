<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="_csrf" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:content="${_csrf.headerName}">
    <link rel="stylesheet" th:href="@{/css/LuckyItem/drawLuckyItem.css}">
    <title>아이템 뽑기</title>
</head>
<body>
<nav>
    <a th:href="@{/lobby}"><h2>아이템 뽑기</h2></a>
</nav>
<main>
    <div>
        <div id="lucky-item">
            <img src="/image/drawItemBox.png" alt="아이템 뽑기" >
        </div>
    </div>

    <div id="renderItems" hidden="hidden"></div>
</main>

<script>
    const renderItemsDiv = document.getElementById("renderItems");
    const luckyItem = document.getElementById("lucky-item");
    const csrfToken = document.querySelector('meta[name="_csrf"]').content;
    const csrfHeader = document.querySelector('meta[name="_csrf_header"]').content;

    luckyItem.addEventListener("click",  async () => {

        const items = await requestDrawItems()

        renderItems(items);
    })



    async function requestDrawItems() {
        const response = await fetch(`/api/users/me/draw-luckyItems`, {
            method: "POST",
            headers: {
                [csrfHeader]: csrfToken
            }
        });

        if(!response.ok) {
            alert("아이템을 뽑는데 실패했습니다.")
            return;
        }
        renderItemsDiv.hidden = false;
        return response.json();
    }

    function renderItems(items) {
        renderItemsDiv.replaceChildren();

        items.forEach(item => {
            const image = document.createElement("img");

            image.className = "viewItem";
            image.dataset.rank = item.rank;
            image.src = item.imagePath;
            image.alt = item.luckyItemName;

            renderItemsDiv.appendChild(image);
        })
        const button = document.createElement("button");
        button.type = "button";
        button.textContent = "닫기";

        button.addEventListener("click", () => {
            renderItemsDiv.replaceChildren();
            renderItemsDiv.hidden = true;
        });

        renderItemsDiv.appendChild(button);
    }

</script>
</body>
</html>
