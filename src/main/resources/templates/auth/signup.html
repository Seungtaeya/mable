<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/home/signup.css">
    <title>회원가입</title>
</head>
<body>
<div id="signup_box">
    <a href="/"><h1>회원가입</h1></a>
    <form id="signupForm" method="post" th:action="@{/registry}">
        <div id="input_box">
            <label for="nickname">아이디 *</label>
            <input type="text" id="nickname" name="username" required>
            <label for="password">비밀번호 *</label>
            <input type="password" id="password" name="password" required>
            <label for="chkPassword">비밀번호 확인 *</label>
            <input type="password" id="chkPassword" name="checkPassword" required>
            <label for="email">이메일 *</label>
            <input type="email" id="email" name="email" required>
        </div>
        <button type="submit">회원가입</button>
    </form>
</div>


</body>
</html>
