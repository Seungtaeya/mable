<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/game/playerDetail.css">
    <title>유저 상세 화면</title>
</head>
<body>
    <main>
        <div>
            <div id="items">
                <ul th:each="equipItem : ${playerDetail.equipItems}">
                    <li id="itemImage">
                        <button type="button" class="item-trigger" aria-expanded="false"
                                th:attr="data-item-name=${equipItem.itemName}, data-skill-description=${equipItem.itemDescription}">
                        <img th:src="${equipItem.imagePath}" th:alt="${equipItem.itemName}">
                        </button>
                    </li>
                </ul>
                <div id="itemSkillDetail" hidden="hidden">
                    <strong id="itemSkillName"></strong>
                    <p id="itemSkillDescription"></p>
                </div>
            </div>

            <div>
                <span id="characterName" th:text="${playerDetail.characterName}"></span>
                <img id="characterImage" th:src="${playerDetail.characterImagePath}">

                <div id="characterSkill">
                    <ul th:each="skill : ${playerDetail.characterSkills}">
                        <li> <img th:src="@{${skill.imagePath()}}" alt="캐릭터 스킬">
                            <span th:text="@{${skill.skillDescription()}}"></span>
                        </li>
                    </ul>
                </div>
            </div>
        </div>

        <button id="closeBtn" type="button">닫기</button>
    </main>

<script>
    const button = document.getElementById("closeBtn")
    const items = document.getElementById("items");
    const detail = document.getElementById("itemSkillDetail");
    const skillName = document.getElementById("itemSkillName");
    const skillDescription = document.getElementById("itemSkillDescription");

    button.addEventListener("click", () => {
        window.close();
    })

    items.addEventListener("click",(event) => {
        const button = event.target.closest(".item-trigger");
        if(!button) return;

        showItemSkill(button);
    })

    function showItemSkill(button) {
        detail.hidden = true;

        skillName.textContent = button.dataset.itemName;
        skillDescription.textContent = button.dataset.skillDescription || "스킬 설명이 없습니다.";

        detail.hidden = false;
    }
</script>
</body>
</html>
